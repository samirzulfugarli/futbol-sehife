
name: Yenile

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: futbol-sehife-main
  cancel-in-progress: false

jobs:
  yenile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sehifeni yarat
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TEST: "1"
        run: python generate.py

      - name: Deyisiklik varsa yaz
        run: |
          git config user.name "yenile-bot"
          git config user.email "yenile-bot@users.noreply.github.com"

          git add index.html telegram_state.json

          if ! git diff --cached --quiet; then
            git commit -m "yenilendi"

            for i in 1 2 3; do
              git fetch origin main

              if ! git rebase origin/main; then
                git rebase --abort
                echo "Rebase ugursuz oldu"
                exit 1
              fi

              if git push origin HEAD:main; then
                echo "Push ugurla tamamlandi"
                exit 0
              fi

              echo "Push alinmadi, yeniden cehd ($i)"
              sleep 20
            done

            exit 1
          else
            echo "Deyisiklik yoxdur"
          fi
